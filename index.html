<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ラッキーロットシミュレーター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="rainbow">ラッキーロットシミュレーター</h1>

<!-- Mode Select -->
<div class="mode-container">
  <div class="mode-card active" onclick="setMode('mythic')">ミシック</div>
  <div class="mode-card" onclick="setMode('god')">ゴッド</div>
  <div class="mode-card" onclick="setMode('secret')">シクレ</div>
</div>

<img id="banner" src="LuckyRot_Mythic.png" class="banner">

<button class="draw-btn" onclick="singleDraw()">引く</button>

<!-- Pop-Up -->
<div id="popup" class="popup">
  <div class="popup-content">
    <h2>獲得！</h2>
    <img id="popup-img">
    <p id="popup-name"></p>
    <button class="close-btn" onclick="closePopup()">閉じる</button>
  </div>
</div>

<script src="a.js"></script>
</body>
</html>

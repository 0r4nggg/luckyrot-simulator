<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ラッキーロットシミュレーター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="rainbow">ラッキーロットシミュレーター</h1>

<div class="lot-container">
  
  <div class="lot-card active" onclick="setLot('normal', event)">通常ロット</div>
  <div class="lot-card" onclick="setLot('grande', event)">グランデ</div>
  
</div>
<!-- Mode Select -->
<div class="mode-container">

  <div class="mode-card mythic active" onclick="setMode('mythic', event)">
    <h2>ミシック</h2>
  </div>

  <div class="mode-card god" onclick="setMode('god', event)">
    <h2>ブレインロットゴッド</h2>
  </div>

  <div class="mode-card secret" onclick="setMode('secret', event)">
    <h2>シークレット</h2>
  </div>

</div>

<img id="banner" src="LuckyRot_Mythic.png" class="banner">

<button class="draw-btn" onclick="singleDraw()">引く</button>

<!-- Pop-Up -->
<div id="popup" class="popup">
  <div class="popup-content">
    <h2>獲得！</h2>
    <img id="popup-img">
    <p id="popup-name"></p>
    <button class="close-btn" onclick="closePopup()">閉じる</button>
  </div>
</div>

<script src="a.js"></script>
</body>
</html>
